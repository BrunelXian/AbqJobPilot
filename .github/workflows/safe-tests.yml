# Draft: local review only until separately authorised commit/push.
name: Safe Python checks
on:
  pull_request:
    branches: [Develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-26
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install test dependency in ephemeral runner
        run: python -m pip install pytest==9.1.0
      - name: Static and isolated no-process tests
        shell: pwsh
        run: python -B scripts/ci_safe_checks.py --root "$env:RUNNER_TEMP/abqjobpilot-safe-${{ github.run_id }}-${{ github.run_attempt }}"
