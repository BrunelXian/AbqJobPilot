const params=new URLSearchParams(location.search);

let scene=['empty','new','running','ended','unknown','offline'].includes(params.get('scene'))?params.get('scene'):'empty';
let page=params.get('page')||'overview', tab='evidence', wizard=0, priorPage='projects';
const pages=['overview','projects','queue','runs','results','agent','classic','settings','service'];
if(!pages.includes(page))page='overview';
const paths={overview:'M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M15 15h6v6h-6z',projects:'M3 6h6l2 3h10v11H3z',queue:'M7 5h14 M7 12h14 M7 19h14 M3 5h.1 M3 12h.1 M3 19h.1',runs:'M3 12h4l3-8 4 16 3-8h4',results:'M5 3h11l3 3v15H5z M9 11h6 M9 15h6',agent:'M8 8 3 12l5 4 M16 8l5 4-5 4 M14 5l-4 14',classic:'M3 5h18v15H3z M3 10h18 M10 10v10',settings:'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M6 6l2 2 M16 16l2 2 M6 18l2-2 M16 8l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',service:'M4 4h16v6H4z M4 14h16v6H4z M7 7h.1 M7 17h.1 M11 7h6 M11 17h6'};
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(key,args={}){let value=catalog[lang][key]||catalog.en[key]||key;return e(value.replace(/\{(\w+)\}/g,(_,k)=>args[k]??'{'+k+'}'));}
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.results}"/></svg>`;
const pill=(text,color='')=>`<span class="pill ${color}"><span class="dot"></span>${text}</span>`;
const btn=(key,action,primary=false,disabled=false)=>`<button ${disabled?'disabled':''} class="${primary?'primary':''}" data-action="${action}">${t(key)}</button>`;
const nav=k=>`<button data-page="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}>${icon(k)}<span>${t(k)}</span></button>`;
const hasProject=()=>scene!=='empty';
const hasRun=()=>!['empty','new'].includes(scene);
const observed=()=>t('observed',{time:'14:32:08 +08:00'});
function status(){return scene==='empty'?t('noProject'):scene==='offline'?t('disconnected'):scene==='new'?t('notRunning'):t('connected');}
function head(title,sub,extra=''){return `<div class="pagehead spread"><div><h1>${t(title)}</h1><p>${sub}</p></div>${extra}</div>`;}
function notice(text,color=''){return `<div class="notice ${color}">${text}</div>`;}
function emptyContent(){return `<div class="hero"><div class="emptyIcon" aria-hidden="true"></div><div class="eyebrow">ABQJOBPILOT</div><h1>${t('welcome')}</h1><p>${t('welcomeText')}</p><div class="row">${btn('new','wizard',true)}${btn('open','open')}</div><div class="emptyRecent"><h2>${t('recent')}</h2><div class="muted">${t('noRecent')}</div></div><p class="small">${t('external')}</p></div>`;}
function newContent(){return `<div class="hero"><div class="emptyIcon" aria-hidden="true"></div><h1>${t('emptyProject')}</h1><p>${t('emptyGuide')}</p><div class="row">${btn('manageService','service',true)}${btn('agent','agent')}</div>${notice(t('initial'),'neutral')}<p>${t('external')}</p></div>`;}
function queuePanel(classic=false){const qstate=classic?t('running'):scene==='ended'?t('finished'):scene==='unknown'?t('unknown'):t('running');return `<section class="panel"><div class="panelhead"><h2>${t('queue')} <span class="muted small">${classic?'2':'1'}</span></h2><span class="pill">${classic?'CLASSIC':'PAUSED'}</span></div><div class="tableScroll"><table class="queueTable"><thead><tr><th>${t('job')}</th><th>${t('stage')}</th><th>Run</th></tr></thead><tbody><tr class="selected"><td><button class="link" data-page="${classic?'classic':'runs'}">axial_bar_04</button><div class="sub">Abaqus / Standard · 1 CPU</div></td><td>${pill(qstate,scene==='unknown'?'amber':'blue')}</td><td><code>${classic?'classic_004':'run_demo_0042'}</code></td></tr>${classic?`<tr><td>bracket_check</td><td>QUEUED</td><td><code>classic_005</code></td></tr>`:''}</tbody></table></div><div class="miniFoot">${classic?t('classicNote'):t('accepted')}</div></section>`;}
function resultsPanel(classic=false){return `<section class="panel"><div class="panelhead"><h2>${t('results')}</h2><button class="link" data-page="results">${t('detail')} →</button></div><div class="tableScroll"><table><thead><tr><th>${t('job')}</th><th>Solver</th><th>DAT / ODB</th></tr></thead><tbody><tr><td>axial_bar_03<div class="sub"><code>${classic?'classic_003':'run_demo_0041'}</code></div></td><td>${pill(t('passed'),'green')}</td><td>PASS / NOT_RUN</td></tr><tr><td>axial_bar_02<div class="sub"><code>${classic?'classic_002':'run_demo_0040'}</code></div></td><td>${pill(t('pending'),'amber')}</td><td>NOT_RUN / NOT_RUN</td></tr></tbody></table></div><div class="miniFoot">${t('resultNote')}</div></section>`;}
function overview(){if(!hasProject())return emptyContent();if(!hasRun())return newContent();return head('overview',`Abaqus / Standard · axial_bar_04 · <code>run_demo_0042</code>`)+`<div class="metrics"><div class="metric"><div class="label">${t('stage')}</div><div class="value">${scene==='ended'?t('finished'):scene==='unknown'?t('unknown'):t('running')}</div><div class="sub">${scene==='ended'?'FINISHED':scene==='unknown'?'RECONCILIATION_REQUIRED':'EXECUTING · ANALYSIS'}</div></div><div class="metric"><div class="label">${t('dispatch')}</div><div class="value">PAUSED</div><div class="sub">single_run_permit: CONSUMED</div></div><div class="metric"><div class="label">${t('slot')}</div><div class="value">${scene==='ended'?'—':t('held',{run:'0042'})}</div><div class="sub">${scene==='ended'?'COMMITTED_EMPTY_SCOPE':'scope_demo_0042'}</div></div></div><div class="split">${queuePanel()}<div class="divider" role="separator" tabindex="0" aria-label="Queue / Results divider" aria-orientation="vertical"></div>${resultsPanel()}</div><div style="margin-top:18px">${notice(t('scopeNote'),scene==='unknown'?'amber':'neutral')}</div><div class="spread recordNote"><span>${t('readScope')}</span><button class="link" data-page="runs">${t('monitor')} →</button></div>`;}
function dimension(key,value,color,raw){return `<div class="dimension"><div class="muted">${t(key)}</div>${pill(value,color)}<div class="raw mono">${raw}</div></div>`;}
function dimensions(){const ended=scene==='ended',unknown=scene==='unknown';return `<div class="dimensionGrid">${dimension('process',ended?t('finished'):unknown?t('unknown'):t('running'),ended?'green':unknown?'amber':'blue',ended?'COMMITTED_EMPTY_SCOPE':unknown?'NOT_CONFIRMED':'ACTIVE · last OS count: 3')}${dimension('solver',ended||unknown?t('passed'):t('pending'),ended||unknown?'green':'',''+(ended||unknown?'COMPLETED':'EVIDENCE_INSUFFICIENT'))}${dimension('dat',ended||unknown?t('passed'):t('notRun'),ended||unknown?'green':'',ended||unknown?'PASS · 3/3':'NOT_RUN')}${dimension('odb',t('notRun'),'','NOT_RUN')}${dimension('outside',t('unknown'),'amber','UNKNOWN')}${dimension('slot',ended?'—':t('held',{run:'0042'}),ended?'':'blue',ended?'slot_run_id: null':'slot_run_id: run_demo_0042')}</div>`;}
function evidence(){if(tab==='identity')return `<div class="panelbody"><dl class="kv"><dt>Project / instance</dt><dd><code>project_demo_bar / instance_demo_01</code></dd><dt>Run / Job</dt><dd><code>run_demo_0042 / job_demo_04</code></dd><dt>Plan / receipt</dt><dd><code>plan_demo_04 / receipt_demo_04</code></dd><dt>Owner</dt><dd><code>owner_demo_01</code></dd><dt>Request</dt><dd><code>request_demo_axial_04</code></dd><dt>Backend</dt><dd><code>abaqus-standard-axial-2024-v1</code></dd></dl></div>`;
if(tab==='events')return `<div class="tableScroll"><table><thead><tr><th>#</th><th>${t('record')}</th><th>${t('time')}</th></tr></thead><tbody><tr><td>118</td><td><code>REQUEST_ACCEPTED</code></td><td>14:31:45</td></tr><tr><td>119</td><td><code>START_INTENT</code></td><td>14:31:46</td></tr><tr><td>120</td><td><code>PROCESS_OBSERVATION</code></td><td>14:32:08</td></tr></tbody></table></div>`;
return `<div class="tableScroll"><table><thead><tr><th>${t('record')}</th><th>${t('source')}</th><th>${t('status')}</th><th>${t('time')}</th></tr></thead><tbody><tr><td><code>scope_demo_0042</code></td><td>Owner / OS Job query</td><td>${scene==='ended'?'active=0':'active=3'} <span class="muted">(${t('record')})</span></td><td>14:32:08</td></tr><tr><td><code>exit_demo_root</code></td><td>OS handle / root</td><td>exit=0</td><td>14:32:04</td></tr><tr><td><code>solver_demo_04</code></td><td>Run / text evidence</td><td>${scene==='ended'||scene==='unknown'?'COMPLETED':'PENDING'}</td><td>14:32:08</td></tr><tr><td><code>validation_demo_04</code></td><td>DAT / independent validation</td><td>${scene==='ended'||scene==='unknown'?'PASS':'NOT_RUN'}</td><td>14:32:08</td></tr></tbody></table></div>`;}
function runs(){if(!hasProject())return emptyContent();if(!hasRun())return newContent();return head('runs',t('page'))+`<div class="runsLayout"><section class="panel"><div class="panelhead"><h2>${t('monitor')}</h2></div><div class="runChoice active"><strong>axial_bar_04</strong><p><code>run_demo_0042</code></p><p>${scene==='ended'?t('finished'):scene==='unknown'?t('unknown'):t('running')}</p></div><div class="runChoice"><strong>axial_bar_03</strong><p><code>run_demo_0041</code></p><p>COMPLETED · DAT PASS</p></div><div class="runChoice"><strong>axial_bar_02</strong><p><code>run_demo_0040</code></p><p>UNKNOWN</p></div><div class="panelbody">${btn('older','older',false,true)}<p class="small muted">${t('accepted')}</p></div></section><section class="panel"><div class="panelhead"><div><h2>axial_bar_04</h2><code>run_demo_0042 · receipt_demo_04</code></div><span class="pill">PAUSED</span></div>${dimensions()}${scene==='unknown'?notice(t('retain'),'amber'):''}<div class="tabs" role="tablist">${['evidence','identity','events'].map(k=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'active':''}" data-tab="${k}">${t(k)}</button>`).join('')}</div>${evidence()}<div class="panelbody small muted">${t('scopeNote')}</div></section></div>`;}
function projects(){return head('projects',t('external'),`<div class="row">${btn('new','wizard',true)}${btn('open','open')}</div>`)+`<section class="panel"><div class="panelhead"><h2>${t('recent')}</h2></div><div class="panelbody">${hasProject()?`<div class="spread"><div><h2>Axial bar study</h2><p class="muted small">Abaqus · <code>project_demo_bar</code></p><code>&lt;selected directory&gt; / agent_project.json</code></div>${btn('overview','overview',true)}</div><div class="row">${btn('projectSettings','projectSettings')}${btn('manageService','service')}</div>`:`<p class="muted">${t('noRecent')}</p>`}</div></section><div style="margin-top:18px">${notice(t('classicSelect'),'neutral')}<button class="link" data-page="classic">${t('classicOpen')} →</button></div>`;}
function queuePage(){return !hasRun()?(!hasProject()?emptyContent():newContent()):head('queue',t('accepted'))+queuePanel()+`<div style="margin-top:18px">${notice(t('noSubmit'),'neutral')}</div>`;}
function resultsPage(){return head('results',t('resultNote'))+(!hasRun()?`<section class="panel notebookBlank">${t('noResult')}</section>`:resultsPanel()+`<div class="panel" style="margin-top:18px"><div class="panelhead"><h2>axial_bar_03 · run_demo_0041</h2>${pill('DAT PASS','green')}</div><table><thead><tr><th>${t('record')}</th><th>Reference</th><th>Observed</th><th>Absolute error / tolerance</th></tr></thead><tbody><tr><td>Node 2 · U1</td><td>0.01 mm</td><td>0.01 mm</td><td>0 / 1e−6 mm</td></tr><tr><td>Element 1 · IP 1 · S11</td><td>1 MPa</td><td>1 MPa</td><td>0 / 1e−4 MPa</td></tr><tr><td>Node 1 · RF1</td><td>−1 N</td><td>−1 N</td><td>0 / 1e−4 N</td></tr></tbody></table><div class="miniFoot">ODB: NOT_RUN · ${t('outside')}: UNKNOWN · ${t('source')}: synthetic design data</div></div>`);}
function classicResults(){return `<section class="panel"><div class="panelhead"><h2>${t('results')}</h2><span class="pill">CLASSIC</span></div><table><thead><tr><th>${t('job')}</th><th>${t('status')}</th><th>${t('source')}</th></tr></thead><tbody><tr><td>axial_bar_03</td><td>COMPLETED</td><td><code>classic_003</code></td></tr><tr><td>axial_bar_02</td><td>WARNING</td><td><code>classic_002</code></td></tr></tbody></table><div class="miniFoot">${t('classicNote')}</div></section>`;}
function classic(){return head('classic',t('classicNote'))+notice(t('classicSelected'),'neutral')+`<div class="row" style="margin:14px 0">${btn('classicOpen','classicOpen',true)}${btn('addInput','blocked',false,true)}${btn('startQueue','blocked',false,true)}${btn('stopAfter','blocked',false,true)}<span class="small muted">${t('classicControls')}</span></div><div class="split">${queuePanel(true)}<div class="divider" role="separator" tabindex="0" aria-label="Queue / Results divider" aria-orientation="vertical"></div>${classicResults()}</div><p class="recordNote">${t('source')}: Classic / <code>classic_project_demo</code> · ${t('monitor')}: <code>project_demo_bar</code></p>`;}
function service(){return head('service',t('closeNote'))+`<div class="serviceGrid"><section class="panel"><div class="panelhead"><h2>${hasProject()?'Axial bar study':t('noProject')}</h2>${pill(status(),scene==='offline'?'amber':hasRun()?'green':'')}</div><div class="panelbody"><dl class="kv"><dt>Project</dt><dd><code>${hasProject()?'project_demo_bar':'—'}</code></dd><dt>Owner</dt><dd><code>${hasRun()?'owner_demo_01':'—'}</code></dd><dt>${t('dispatch')}</dt><dd>${hasProject()?'PAUSED':'—'}</dd><dt>${t('slot')}</dt><dd>${hasRun()&&scene!=='ended'?'run_demo_0042':'—'}</dd><dt>${t('time')}</dt><dd>${hasRun()?'14:32:08 +08:00':'—'}</dd></dl><div class="serviceButtons">${btn('start','servicePreview',false,!hasProject()||hasRun())}${btn('reconnect','reconnect',false,!hasProject())}${btn('disconnect','disconnect',false,!hasRun()||scene==='offline')}${btn('stop','stopPreview',false,!hasRun()||scene==='offline')}</div></div></section><section class="panel"><div class="panelhead"><h2>${t('review')}</h2></div><div class="panelbody"><p>${t('stopNote')}</p>${notice(t('permission'),'neutral')}<p class="small muted">${t(hasRun()?'scopeNote':'initial')}</p></div></section></div>`;}
function agent(){return head('agent',t('permission'))+`<div class="capability"><section class="panel"><div class="panelhead"><h2>Python API</h2><span class="pill blue">Project service</span></div><div class="panelbody"><p>${t('pythonText')}</p><dl class="kv"><dt>Project</dt><dd><code>${hasProject()?'project_demo_bar':'—'}</code></dd><dt>Service</dt><dd>${status()}</dd></dl><p class="small muted">${t('secretText')}</p>${btn('documentation','docs')}</div></section><section class="panel"><div class="panelhead"><h2>MCP</h2><span class="pill amber">Classic / read-only</span></div><div class="panelbody"><p>${t('mcpText')}</p><code>abq_preflight<br>abq_list_jobs<br>abq_job_status<br>abq_locate_outputs<br>abq_prepare_enqueue</code><p class="small muted">${t('noSubmit')}</p></div></section></div><div style="margin-top:18px">${notice(t('secretText'),'neutral')}</div>`;}
function settings(){return head('settings',t('languageNote'))+`<section class="panel"><div class="panelhead"><h2>${t('language')}</h2><span class="pill">Default: English</span></div><div class="panelbody"><div class="languageGrid">${Object.entries({'en':'English','zh-CN':'简体中文','fr-FR':'Français','de-DE':'Deutsch'}).map(([k,label])=>`<button class="languageOption ${lang===k?'selected':''}" data-lang="${k}">${label}<span>${k} · ${t('coverage')}</span></button>`).join('')}</div>${notice(t('reviewPending'),'neutral')}</div></section><section class="panel" style="margin-top:18px"><div class="panelhead"><h2>${t('layout')}</h2>${btn('resetLayout','resetLayout')}</div><div class="panelbody">${t('layoutNote')}</div></section>`;}
function modal(){if(!wizard)return '';let body=wizard===1?`<div class="field"><label for="name">${t('projectName')}</label><input id="name" value="Axial bar study" maxlength="120"></div><div class="field"><label for="directory">${t('location')}</label><input id="directory" value="&lt;explicit new directory&gt;" readonly></div><div class="field"><label for="projectType">${t('type')}</label><select id="projectType"><option>Abaqus</option></select></div><p class="small muted">${t('newDetail')}</p>${notice(t('ownership'),'neutral')}`:`<dl class="kv"><dt>${t('projectName')}</dt><dd>Axial bar study</dd><dt>${t('type')}</dt><dd>Abaqus</dd><dt>${t('location')}</dt><dd><code>&lt;explicit new directory&gt;</code></dd><dt>${t('format')}</dt><dd>Project v1 / Execution store v3</dd></dl><div style="margin-top:20px">${notice(t('initial'),'neutral')}</div><p>${t('ownership')}</p>`;return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="wizardTitle"><div class="modalHead"><h2 id="wizardTitle">${t('new')}</h2><div class="steps">${wizard} / 2 · ${wizard===1?t('projectName'):t('review')}</div></div><div class="modalBody">${body}</div><div class="modalFoot">${btn('cancel','cancel')}${wizard===2?btn('back','wizardBack'):''}${btn(wizard===1?'review':'create',wizard===1?'wizardNext':'createPreview',true)}</div></section></div>`;}
function logs(){if(!hasRun()&&page!=='classic')return `<div class="loghead"><strong>${t('logs')}</strong><span class="muted">${t('noLogs')}</span></div>`;const empty=!hasRun();let left=empty?'—':`14:31:46  Job: axial_bar_04\n14:31:47  Standard / analysis\n14:32:02  STEP 1    INC 1    TIME 1.000\n14:32:08  ${scene==='ended'||scene==='unknown'?'THE ANALYSIS HAS COMPLETED SUCCESSFULLY':'Recorded output available; completion not yet confirmed'}`;let right=empty?'—':`118  REQUEST_ACCEPTED       run_demo_0042\n119  START_INTENT           attempt_demo_04\n120  ROOT_PROCESS_CREATED  scope_demo_0042\n121  PROCESS_OBSERVATION    active_processes=3\n${scene==='ended'?'122  MANAGED_COMPLETION     COMMITTED_EMPTY_SCOPE':''}`;if(page==='classic'){left='14:31:46  Classic job: classic_004\n14:31:47  STA / recorded file content\n14:32:08  STEP 1    INC 1';right='Classic queue / classic_project_demo\nSource: legacy runner console\nCurrent selection: classic_004\nNo Project service events in this pane.';}return `<div class="loghandle" role="separator" tabindex="0" aria-label="Log height" aria-orientation="horizontal"></div><section class="logdock">${[left,right].map((text,i)=>`<div class="logpane"><div class="loghead"><strong>${i?'Console / Events':'STA / Text'}</strong><span class="muted">${page==='classic'?'Classic':'Run 0042'} · ${t('record')}</span><label><input type="checkbox" checked>${t('follow')}</label></div><pre>${e(text)}</pre></div>`).join('')}</section>`;}
function render(){document.documentElement.lang=lang;document.querySelector('#scene').value=scene;document.querySelector('#locale').value=lang;const app=document.querySelector('#app');app.innerHTML=`<div class="titlebar"><span class="logo">A</span><strong>AbqJobPilot</strong><span class="muted">0.3.0 Dev</span><span class="window-controls" aria-hidden="true">— □ ×</span></div><nav class="nav" aria-label="Workspace"><div class="section">${t('workspace')}</div>${pages.slice(0,7).map(nav).join('')}<div class="spacer"></div><div class="separator"></div>${nav('service')}${nav('settings')}<div class="caption">${t(page==='classic'?'classicNote':'closeNote')}</div></nav><header class="context"><div class="project"><strong>${page==='classic'?'Classic sample':hasProject()?'Axial bar study':t('noProject')}</strong><div class="muted">${page==='classic'?'Classic Project · classic_project_demo':hasProject()?'Abaqus · project_demo_bar · instance_demo_01':'AbqJobPilot Project'}</div></div>${page==='classic'?pill('Classic / local queue'):pill(status(),scene==='offline'?'amber':hasRun()?'green':'')}<button class="quiet" data-page="projects">${t('projects')} ▾</button></header><main class="workspace">${scene==='offline'?notice(t('stale'),'amber'):''}<div class="content">${({overview,projects,queue:queuePage,runs,results:resultsPage,classic,service,agent,settings}[page])()}</div>${logs()}</main><footer class="footer"><span>${hasRun()?observed():status()}</span><span>${page==='classic'?'Classic / classic_project_demo':hasRun()?'owner_demo_01 · PAUSED':'—'}</span><span class="resource">${t('machine')} · CPU 18% · RAM 6.2 / 32 GB · GPU —</span></footer>${modal()}`;bind();}
function go(k){page=k;wizard=0;render();}
function toast(text){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;document.querySelector('#app').append(el);}
function action(a){if(pages.includes(a))return go(a);if(a==='wizard'){priorPage=page;wizard=1;render();document.querySelector('#name').focus();}else if(a==='wizardNext'){wizard=2;render();}else if(a==='wizardBack'){wizard=1;render();}else if(a==='cancel'){wizard=0;render();}else if(a==='createPreview'){wizard=0;scene='new';page='overview';render();toast('Design preview only. No Project, credential or service was created.');}else if(a==='open'){scene='running';page='projects';render();toast('Synthetic Project selected. No directory was opened.');}else if(a==='disconnect'){scene='offline';render();}else if(a==='reconnect'){toast('Design preview: reauthenticate the selected Project and owner. No IPC request is made.');}else if(a==='stopPreview'){toast('Design preview: '+(scene==='ended'?'safe idle review and explicit confirmation required.':'BLOCKED — active or unresolved Run. No stop request was made.'));}else if(a==='servicePreview'){toast('Design preview only. Start would be an explicit ServiceLifecycleManager action, never a navigation effect.');}else if(a==='resetLayout'){document.documentElement.style.removeProperty('--queue');render();}else if(a==='projectSettings'){toast('Project Settings: identity and format read-only; no backend, permission or storage conversion switch.');}else if(a==='classicOpen'){toast('Design preview: require explicit compatible Classic Project. No legacy Runtime initialization.');}else if(a==='docs'){toast('Existing references: docs/ABQJOBPILOT_PUBLIC_API.md (Classic) and Run020/021B contracts (Project service). No executable commands in this preview.');}else{toast('Static design control. No application action.');}}
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>go(el.dataset.page));document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render();});document.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>{lang=el.dataset.lang;render();});document.querySelectorAll('.divider').forEach(el=>{el.onpointerdown=ev=>{el.setPointerCapture(ev.pointerId);el.onpointermove=move=>{const box=el.parentElement.getBoundingClientRect();let pct=Math.max(35,Math.min(65,(move.clientX-box.left)/box.width*100));document.documentElement.style.setProperty('--queue',pct+'%');};el.onpointerup=()=>el.onpointermove=null;};el.onkeydown=ev=>{if(['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();let p=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--queue'));document.documentElement.style.setProperty('--queue',Math.max(35,Math.min(65,p+(ev.key==='ArrowLeft'?-2:2)))+'%');}};});const handle=document.querySelector('.loghandle');if(!handle)return;handle.onpointerdown=ev=>{handle.setPointerCapture(ev.pointerId);handle.onpointermove=move=>{const box=document.querySelector('.workspace').getBoundingClientRect();document.querySelector('.logdock').style.height=Math.max(95,Math.min(box.height*.45,box.bottom-move.clientY))+'px';};handle.onpointerup=()=>handle.onpointermove=null;};handle.onkeydown=ev=>{if(['ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();const dock=document.querySelector('.logdock');dock.style.height=Math.max(95,Math.min(300,dock.offsetHeight+(ev.key==='ArrowUp'?12:-12)))+'px';}};}
document.querySelector('#scene').onchange=ev=>{scene=ev.target.value;render();};document.querySelector('#locale').onchange=ev=>{lang=ev.target.value;render();};document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&wizard){wizard=0;render();}if(ev.altKey&&ev.key==='1')go('overview');if(ev.altKey&&ev.key==='4')go('runs');});render();
</script></body></html>
